[OPTIONS]
enable: 1
policy_in: DROP
policy_out: DROP

[RULES]

# --- INBOUND RULES ---
# Allow Web UI & API from local LAN
IN ACCEPT -p tcp -dport 5000,8971 -source 10.0.0.0/24 -log nolog
# Allow WebRTC streaming (TCP & UDP) from local LAN
IN ACCEPT -p tcp -dport 8555 -source 10.0.0.0/24 -log nolog
IN ACCEPT -p udp -dport 8555 -source 10.0.0.0/24 -log nolog
# Allow RTSP re-streaming from local LAN
IN ACCEPT -p tcp -dport 8554 -source 10.0.0.0/24 -log nolog

# --- OUTBOUND RULES ---
# Allow RTSP pull from Tapo C200
OUT ACCEPT -p tcp -dport 554 -dest 10.0.0.221 -log nolog
# Allow MQTT traffic
OUT ACCEPT -p tcp -dport 1883 -dest 10.0.0.0/24 -log nolog
# Allow local DNS
OUT ACCEPT -p udp -dport 53 -dest 10.0.0.0/24 -log nolog
# Allow NTP time sync
OUT ACCEPT -p udp -dport 123 -log nolog
